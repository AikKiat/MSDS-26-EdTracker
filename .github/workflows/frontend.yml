name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "amplify.yml"
      - "infrastructure/amplify/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "amplify.yml"
      - "infrastructure/amplify/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "857196482054"
  FRONTEND_DEPLOY_ROLE_ARN: arn:aws:iam::857196482054:role/edtracker-github-frontend-deployer
  AMPLIFY_APP_ID: d1fob4i4hsu1oz
  AMPLIFY_BRANCH: main
  AMPLIFY_URL: https://main.d1fob4i4hsu1oz.amplifyapp.com
  VITE_API_BASE_URL: https://0cu1jmf5r7.execute-api.ap-southeast-1.amazonaws.com

jobs:
  test:
    name: Lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy frontend
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Apply Amplify SPA rules
        run: |
          aws amplify update-app \
            --app-id "$AMPLIFY_APP_ID" \
            --region "$AWS_REGION" \
            --custom-rules file://infrastructure/amplify/custom-rules.json \
            > /dev/null

      - name: Upload and start Amplify deployment
        id: amplify-deployment
        run: |
          archive="$RUNNER_TEMP/amplify-deploy.zip"
          (cd frontend/dist && zip -q -r "$archive" .)

          deployment="$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --region "$AWS_REGION" \
            --output json)"

          job_id="$(jq -r '.jobId' <<< "$deployment")"
          upload_url="$(jq -r '.zipUploadUrl' <<< "$deployment")"
          test "$job_id" != "null"
          test "$upload_url" != "null"
          echo "::add-mask::$upload_url"

          curl --fail --silent --show-error --upload-file "$archive" "$upload_url"
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$job_id" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify deployment
        env:
          JOB_ID: ${{ steps.amplify-deployment.outputs.job_id }}
        run: |
          for attempt in $(seq 1 60); do
            status="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'job.summary.status' \
              --output text)"
            echo "Amplify job $JOB_ID: $status"

            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Amplify job $JOB_ID" >&2
          exit 1

      - name: Verify frontend
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$AMPLIFY_URL" > /dev/null
